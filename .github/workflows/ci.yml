name: Services CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'apps/api-gateway/**'
      - 'apps/auth-service/**'
      - 'apps/users-service/**'
      - 'apps/notifications-service/**'
      - 'apps/payments-service/**'
      - 'infra/docker/gateway/**'
      - 'infra/docker/auth/**'
      - 'infra/docker/users/**'
      - 'infra/docker/payments/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
      - 'docker-compose.yml'
      - 'specs/001-fundamentos-identidad/contracts/openapi-public.yaml'
      - 'specs/001-fundamentos-identidad/contracts/openapi-auth-service.yaml'
      - 'specs/001-fundamentos-identidad/contracts/openapi-users-service.yaml'
      - 'specs/003-notificaciones/**'
      - 'specs/003-reservas-pagos-resenas/payments_service/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_AUTH_DATABASE_URL: postgresql://auth_test:auth_test@localhost:5432/auth_test?schema=public
      TEST_AUTH_REDIS_URL: redis://localhost:6379/15
      # The harness only cleans when explicitly opted in AND the targets are the
      # isolated service containers above (database ending in `_test`, Redis DB 15).
      AUTH_TEST_ALLOW_CLEANUP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:auth:generate
      - run: npm run prisma:auth:migrate:deploy
        env:
          AUTH_DATABASE_URL: ${{ env.TEST_AUTH_DATABASE_URL }}
      - run: npm run lint:auth
      - run: npm run typecheck:auth
      - run: npm run test:auth:coverage
      - run: npm run openapi:auth:check
      - run: npm run build:auth
      - run: docker build --target runtime -f infra/docker/auth/Dockerfile .
      - run: npm run test:auth:cross-service -- --runTestsByPath test/integration/auth-compose.spec.ts

  gateway-quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:gateway
      - run: npm run typecheck:gateway
      - run: npm run test:gateway:coverage
      - run: npm run openapi:check:gateway
      - run: npm run build:gateway
      - run: docker build --target runtime -f infra/docker/gateway/Dockerfile .

  # GW-061: perfil k6 del Plan §8 (100 usuarios ACTIVE, warm-up 30 s y dos escenarios de
  # 25 req/s durante 2 min, p95 < 500 ms y errores < 1%). Requiere Auth y Users reales detrás del
  # Gateway, por lo que SOLO se ejecuta cuando el repositorio define GATEWAY_PERF_BASE_URL y el
  # secreto GATEWAY_PERF_BEARER (o las credenciales de login). No se inventan resultados.
  gateway-performance:
    runs-on: ubuntu-latest
    if: vars.GATEWAY_PERF_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run apps/api-gateway/test/performance/identity.k6.js
        env:
          GATEWAY_PERF_BASE_URL: ${{ vars.GATEWAY_PERF_BASE_URL }}
          GATEWAY_PERF_BEARER: ${{ secrets.GATEWAY_PERF_BEARER }}
          GATEWAY_PERF_USER_EMAIL: ${{ secrets.GATEWAY_PERF_USER_EMAIL }}
          GATEWAY_PERF_USER_PASSWORD: ${{ secrets.GATEWAY_PERF_USER_PASSWORD }}

  users-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: users_db
          POSTGRES_USER: users
          POSTGRES_PASSWORD: users_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U users -d users_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      USERS_DATABASE_URL: postgresql://users:users_test_only@localhost:5432/users_db
      USERS_TEST_DATABASE_URL: postgresql://users:users_test_only@localhost:5432/users_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:users:generate
      - run: npm run prisma:users:migrate:deploy
      - run: npm run typecheck:users
      - run: npm run lint:users
      - run: npm run test:users:unit -- --coverage --coverageDirectory=../../coverage/users-unit
      - run: npm run test:coverage --workspace @stayhub/users-service
      - run: npm run build:users
      - run: node scripts/validate-users-openapi.mjs
      - run: docker build -f infra/docker/users/Dockerfile -t stayhub-users:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-coverage
          path: coverage/users

  notifications-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notifications_db
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOTIFICATIONS_DATABASE_URL: postgresql://notifications:notifications_test_only@localhost:5432/notifications_db
    defaults:
      run:
        working-directory: apps/notifications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/notifications-service/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run openapi:validate

  payments-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payments_test
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payments_test -d payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: payments_test
          RABBITMQ_DEFAULT_PASS: payments_test
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAYMENTS_DATABASE_URL: postgresql://payments_test:payments_test@localhost:5432/payments_test?schema=public
      PAYMENTS_TEST_DATABASE_URL: postgresql://payments_test:payments_test@localhost:5432/payments_test?schema=public
      PAYMENTS_TEST_RABBITMQ_URL: amqp://payments_test:payments_test@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:payments:generate
      - run: npm run prisma:payments:migrate:deploy
      - run: npm run lint:payments
      - run: npm run typecheck:payments
      - run: npm run test:payments:coverage
      - run: npm run openapi:payments:check
      - run: npm run build:payments
      - run: docker build --target runtime -f infra/docker/payments/Dockerfile .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payments-coverage
          path: coverage/payments