name: Services CI

on:
  pull_request:
    paths:
      - 'apps/api-gateway/**'
      - 'apps/auth-service/**'
      - 'apps/users-service/**'
      - 'apps/search-service/**'
      - 'apps/bookings-service/**'
      - 'infra/docker/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
      - 'docker-compose.yml'
      - 'specs/**'
  push:
    branches: [main]

jobs:
  auth-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_AUTH_DATABASE_URL: postgresql://auth_test:auth_test@localhost:5432/auth_test?schema=public
      TEST_AUTH_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:auth:generate
      - run: npm run prisma:auth:migrate:deploy
        env:
          AUTH_DATABASE_URL: ${{ env.TEST_AUTH_DATABASE_URL }}
      - run: npm run lint:auth
      - run: npm run typecheck:auth
      - run: npm run test:auth -- --coverage
      - run: npm run openapi:auth:check
      - run: npm run build:auth
      - run: docker build --target runtime -f infra/docker/auth/Dockerfile .
      - run: npm run test:auth:cross-service -- --runTestsByPath test/integration/auth-compose.spec.ts

  gateway-quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @stayhub/api-gateway
      - run: npm run typecheck --workspace @stayhub/api-gateway
      - run: npm run test:coverage --workspace @stayhub/api-gateway
      - run: npm run build --workspace @stayhub/api-gateway
      - run: docker build --target runtime -f infra/docker/gateway/Dockerfile .

  users-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: users_db
          POSTGRES_USER: users
          POSTGRES_PASSWORD: users_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U users -d users_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      USERS_DATABASE_URL: postgresql://users:users_test_only@localhost:5432/users_db
      USERS_TEST_DATABASE_URL: postgresql://users:users_test_only@localhost:5432/users_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:users:generate
      - run: npm run prisma:users:migrate:deploy
      - run: npm run typecheck:users
      - run: npm run lint:users
      - run: npm run test:users:unit -- --coverage --coverageDirectory=../../coverage/users-unit
      - run: npm run test:coverage --workspace @stayhub/users-service
      - run: npm run build:users
      - run: node scripts/validate-users-openapi.mjs
      - run: docker build -f infra/docker/users/Dockerfile -t stayhub-users:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-coverage
          path: coverage/users

  bookings-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookings_test
          POSTGRES_USER: bookings_test
          POSTGRES_PASSWORD: bookings_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookings_test -d bookings_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKINGS_DATABASE_URL: postgresql://bookings_test:bookings_test@localhost:5432/bookings_test?schema=public
      BOOKINGS_TEST_DATABASE_URL: postgresql://bookings_test:bookings_test@localhost:5432/bookings_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:bookings:generate
      - run: npm run prisma:bookings:migrate:deploy
      - run: npm run lint:bookings
      - run: npm run typecheck:bookings
      - run: npm run test:bookings:unit
      - run: npm run test:bookings:contract
      - run: npm run test:bookings:security
      - run: npm run test:bookings:concurrency
      - run: npm run test:bookings:integration
      - run: npm run test:e2e --workspace @stayhub/bookings-service
      - run: npm run test:performance --workspace @stayhub/bookings-service
      - run: npm run openapi:bookings:check
      - run: npm run build:bookings
      - run: docker build --target runtime -f infra/docker/bookings/Dockerfile .
