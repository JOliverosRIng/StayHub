name: stayhub

services:
  gateway-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${GATEWAY_REDIS_PASSWORD}"]
    secrets:
      - gateway_redis_password
    networks: [stayhub-internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/gateway_redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: stayhub_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [stayhub-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub_auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD}"]
    networks: [stayhub-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTH_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-migrate:
    build:
      context: .
      dockerfile: infra/docker/auth/Dockerfile
      target: build
    command: ["npm", "run", "prisma:migrate:deploy", "--workspace", "@stayhub/auth-service"]
    env_file: ${AUTH_ENV_FILE:-.env}
    networks: [stayhub-internal]
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/auth/Dockerfile
    env_file: ${AUTH_ENV_FILE:-.env}
    networks: [stayhub-internal]
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  users-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users
      POSTGRES_PASSWORD_FILE: /run/secrets/users_db_password
    secrets: [users_db_password]
    volumes: [users_data:/var/lib/postgresql/data]
    networks: [users-internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U users -d users_db']
      interval: 5s
      timeout: 3s
      retries: 20

  users-migrate:
    build:
      context: .
      dockerfile: infra/docker/users/Dockerfile
      target: migration
    environment:
      USERS_DATABASE_URL_FILE: /run/secrets/users_database_url
    secrets: [users_database_url]
    networks: [users-internal]
    restart: 'no'
    depends_on:
      users-db: { condition: service_healthy }

  users-service:
    build:
      context: .
      dockerfile: infra/docker/users/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      USERS_PORT: '3002'
      USERS_DATABASE_URL_FILE: /run/secrets/users_database_url
      USERS_JWT_ISSUER: ${USERS_JWT_ISSUER:?required}
      USERS_JWT_AUDIENCE: ${USERS_JWT_AUDIENCE:?required}
      USERS_JWT_KID: ${USERS_JWT_KID:?required}
      USERS_JWT_PUBLIC_KEY_FILE: /run/secrets/users_access_public
      USERS_SERVICE_JWT_ISSUER: ${USERS_SERVICE_JWT_ISSUER:?required}
      USERS_SERVICE_JWT_AUDIENCE: ${USERS_SERVICE_JWT_AUDIENCE:?required}
      USERS_SERVICE_JWT_KID: ${USERS_SERVICE_JWT_KID:?required}
      USERS_SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/users_service_public
      USERS_REGISTRATION_SCOPE: ${USERS_REGISTRATION_SCOPE:-users:registration}
      USERS_LOOKUP_SCOPE: ${USERS_LOOKUP_SCOPE:-users:login-identity}
      USERS_MAX_PHOTO_BYTES: '5000000'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?required}
    secrets: [users_database_url, users_access_public, users_service_public]
    networks: [users-internal, services]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      users-migrate: { condition: service_completed_successfully }

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      GATEWAY_PROTOCOL: https
    env_file: ${GATEWAY_ENV_FILE:-.env}
    secrets:
      - gateway_tls_cert
      - gateway_tls_key
      - gateway_redis_password
      - gateway_service_private_key
    networks: [stayhub-edge, stayhub-internal, services]
    ports:
      - "8080:8080"
    depends_on:
      gateway-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0';fetch('https://127.0.0.1:8080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  search-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: search_db
      POSTGRES_USER: stayhub_search
      POSTGRES_PASSWORD: ${SEARCH_DB_PASSWORD:?required}
    volumes: [search_db_data:/var/lib/postgresql/data]
    networks: [search-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub_search -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  search-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SEARCH_REDIS_PASSWORD:?required}"]
    networks: [search-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${SEARCH_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: stayhub_search
      RABBITMQ_DEFAULT_PASS: ${SEARCH_RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: /search
    networks: [search-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  search-migrate:
    build:
      context: .
      dockerfile: infra/docker/search/Dockerfile
      target: migration
    environment:
      SEARCH_DATABASE_URL: ${SEARCH_DATABASE_URL:?required}
    networks: [search-internal]
    restart: "no"
    depends_on:
      search-db: { condition: service_healthy }

  search-service:
    build:
      context: .
      dockerfile: infra/docker/search/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      SEARCH_PORT: "3004"
      SEARCH_DATABASE_URL: ${SEARCH_DATABASE_URL:?required}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:?required}
      SEARCH_RABBITMQ_URL: ${SEARCH_RABBITMQ_URL:?required}
      SEARCH_RABBITMQ_EXCHANGE: ${SEARCH_RABBITMQ_EXCHANGE:-stayhub.search.v1}
      SEARCH_RABBITMQ_QUEUE: ${SEARCH_RABBITMQ_QUEUE:-stayhub.search.projection.v1}
      SEARCH_RABBITMQ_DLQ: ${SEARCH_RABBITMQ_DLQ:-stayhub.search.projection.v1.dlq}
      SEARCH_SERVICE_JWT_PUBLIC_KEYS_JSON: ${SEARCH_SERVICE_JWT_PUBLIC_KEYS_JSON:?required}
      SEARCH_SERVICE_JWT_ISSUER: ${SEARCH_SERVICE_JWT_ISSUER:?required}
      SEARCH_SERVICE_JWT_AUDIENCE: ${SEARCH_SERVICE_JWT_AUDIENCE:?required}
      SEARCH_SERVICE_JWT_SCOPE: ${SEARCH_SERVICE_JWT_SCOPE:-search:invoke}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-60}
      SEARCH_CACHE_JITTER_SECONDS: ${SEARCH_CACHE_JITTER_SECONDS:-10}
      SEARCH_PAGE_SIZE_MAX: ${SEARCH_PAGE_SIZE_MAX:-100}
      SEARCH_SUGGEST_LIMIT_MAX: ${SEARCH_SUGGEST_LIMIT_MAX:-20}
      SEARCH_SIMILARITY_THRESHOLD: ${SEARCH_SIMILARITY_THRESHOLD:-0.3}
      SEARCH_DEPENDENCY_TIMEOUT_MS: ${SEARCH_DEPENDENCY_TIMEOUT_MS:-3000}
      SEARCH_RABBITMQ_PREFETCH: ${SEARCH_RABBITMQ_PREFETCH:-10}
      SEARCH_RABBITMQ_MAX_RETRIES: ${SEARCH_RABBITMQ_MAX_RETRIES:-3}
      SEARCH_RABBITMQ_RETRY_BASE_MS: ${SEARCH_RABBITMQ_RETRY_BASE_MS:-250}
      SEARCH_SHUTDOWN_GRACE_MS: ${SEARCH_SHUTDOWN_GRACE_MS:-10000}
      SEARCH_OTEL_SERVICE_NAME: ${SEARCH_OTEL_SERVICE_NAME:-stayhub-search-service}
      SEARCH_LOG_LEVEL: ${SEARCH_LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?required}
    networks: [search-internal, services]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      search-migrate: { condition: service_completed_successfully }
      search-redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payments-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: stayhub_payments
      POSTGRES_PASSWORD_FILE: /run/secrets/payments_db_password
    secrets: [payments_db_password]
    volumes: [payments_db_data:/var/lib/postgresql/data]
    networks: [payments-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub_payments -d payments_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-migrate:
    build:
      context: .
      dockerfile: infra/docker/payments/Dockerfile
      target: migration
    environment:
      PAYMENTS_DATABASE_URL_FILE: /run/secrets/payments_database_url
    secrets: [payments_database_url]
    networks: [payments-internal]
    restart: 'no'
    depends_on:
      payments-db: { condition: service_healthy }

  payments-service:
    build:
      context: .
      dockerfile: infra/docker/payments/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PAYMENTS_PORT: '3006'
      PAYMENTS_DATABASE_URL_FILE: /run/secrets/payments_database_url
      PAYMENTS_JWT_ISSUER: ${PAYMENTS_JWT_ISSUER:?required}
      PAYMENTS_JWT_AUDIENCE: ${PAYMENTS_JWT_AUDIENCE:?required}
      PAYMENTS_JWT_KID: ${PAYMENTS_JWT_KID:?required}
      PAYMENTS_JWT_PUBLIC_KEY_FILE: /run/secrets/payments_jwt_public
      PAYMENTS_SERVICE_JWT_ISSUER: ${PAYMENTS_SERVICE_JWT_ISSUER:?required}
      PAYMENTS_SERVICE_JWT_AUDIENCE: ${PAYMENTS_SERVICE_JWT_AUDIENCE:?required}
      PAYMENTS_SERVICE_JWT_KID: ${PAYMENTS_SERVICE_JWT_KID:?required}
      PAYMENTS_SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/payments_service_jwt_public
      PAYMENTS_CHARGE_SCOPE: ${PAYMENTS_CHARGE_SCOPE:-payments:charge}
      PAYMENTS_REFUND_SCOPE: ${PAYMENTS_REFUND_SCOPE:-payments:refund}
      PAYMENTS_READ_SCOPE: ${PAYMENTS_READ_SCOPE:-payments:read}
      PAYMENTS_ALLOWED_CURRENCIES: ${PAYMENTS_ALLOWED_CURRENCIES:-COP,USD}
      PAYMENTS_TOKEN_HMAC_SECRET_FILE: /run/secrets/payments_token_hmac_secret
      PAYMENTS_RABBITMQ_EXCHANGE: ${PAYMENTS_RABBITMQ_EXCHANGE:-stayhub.payments}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
    secrets:
      - payments_database_url
      - payments_jwt_public
      - payments_service_jwt_public
      - payments_token_hmac_secret
    networks: [payments-internal, services]
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      payments-db: { condition: service_healthy }
      payments-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_started, required: false }

networks:
  stayhub-edge:
    internal: true
  stayhub-internal:
    internal: true
  users-internal:
    internal: true
  search-internal:
    internal: true
  payments-internal:
    internal: true
  services:
    internal: true

volumes:
  auth-db-data:
  users_data:
  search_db_data:
  payments_db_data:

secrets:
  gateway_tls_cert:
    file: ${GATEWAY_TLS_CERT_SOURCE:-./.artifacts/gateway/tls_cert.pem}
  gateway_tls_key:
    file: ${GATEWAY_TLS_KEY_SOURCE:-./.artifacts/gateway/tls_key.pem}
  gateway_redis_password:
    file: ${GATEWAY_REDIS_PASSWORD_SOURCE:-./.artifacts/gateway/redis_password.txt}
  gateway_service_private_key:
    file: ${GATEWAY_SERVICE_PRIVATE_KEY_SOURCE:-./.artifacts/gateway/service_private_key.pem}
  users_db_password:
    file: ${USERS_DB_PASSWORD_FILE:?required}
  users_database_url:
    file: ${USERS_DATABASE_URL_FILE:?required}
  users_access_public:
    file: ${USERS_JWT_PUBLIC_KEY_FILE:?required}
  users_service_public:
    file: ${USERS_SERVICE_JWT_PUBLIC_KEY_FILE:?required}
  payments_db_password:
    file: ${PAYMENTS_DB_PASSWORD_FILE:?required}
  payments_database_url:
    file: ${PAYMENTS_DATABASE_URL_FILE:?required}
  payments_jwt_public:
    file: ${PAYMENTS_JWT_PUBLIC_KEY_FILE:?required}
  payments_service_jwt_public:
    file: ${PAYMENTS_SERVICE_JWT_PUBLIC_KEY_FILE:?required}
  payments_token_hmac_secret:
    file: ${PAYMENTS_TOKEN_HMAC_SECRET_FILE:?required}
