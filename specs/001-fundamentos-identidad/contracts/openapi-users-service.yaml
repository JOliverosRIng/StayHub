    patch:
      description: Atomic partial update. Omitted fields are preserved; null clears
        optional values. File plus photo:null and empty changes are invalid.
        Authentication precedes ownership and input validation.
      operationId: updateProfile
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - profile
              properties:
                profile:
                  type: object
                  additionalProperties: false
                  required:
                    - expectedVersion
                  properties:
                    expectedVersion:
                      type: integer
                      minimum: 1
                    name:
                      type: string
                      minLength: 2
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      maxLength: 254
                    phone:
                      type: string
                      nullable: true
                      pattern: ^\+[1-9][0-9]{7,14}$
                    preferences:
                      allOf:
                        - type: object
                          maxProperties: 20
                          additionalProperties:
                            oneOf:
                              - type: string
                              - type: number
                              - type: boolean
                      nullable: true
                    photo:
                      type: string
                      nullable: true
                      enum:
                        - null
                photo:
                  type: string
                  format: binary
                  description: JPEG or PNG, maximum 5,000,000 bytes (5 MB decimal).
            encoding:
              profile:
                contentType: application/json
              photo:
                contentType: image/jpeg, image/png
