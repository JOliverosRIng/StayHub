name: stayhub-auth-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_test
      POSTGRES_USER: stayhub_auth_test
      POSTGRES_PASSWORD: ${TEST_AUTH_DB_PASSWORD:-test_password}
    ports:
      - "127.0.0.1:${TEST_AUTH_DB_PORT:-55432}:5432"
    volumes:
      - auth-test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub_auth_test -d auth_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${TEST_AUTH_REDIS_PASSWORD:-test_redis_password}"]
    ports:
      - "127.0.0.1:${TEST_AUTH_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TEST_AUTH_REDIS_PASSWORD:-test_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

volumes:
  auth-test-db-data:
