services:
  users-stub:
    build:
      context: .
      dockerfile: infra/docker/auth/Dockerfile.users-stub
    networks: [services]
    restart: unless-stopped

  auth-service:
    ports:
      - "127.0.0.1:${AUTH_DEV_PORT:-3001}:3001"
    networks: [auth-internal, services, dev-public]
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      users-stub:
        condition: service_started

networks:
  dev-public:
